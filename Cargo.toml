[package]
name = "linux-packager"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Package Linux executables into .deb and .rpm formats"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["linux", "packaging", "deb", "rpm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "linux-packager"
path = "src/main.rs"

[lib]
name = "linux_packager"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
